name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      # 网页计算器把模型用 JavaScript 重写了一遍, 测试会在 node 里跑它并与
      # Python 逐位对照(tests/test_web_calculator.py), 所以 CI 需要 node。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 模型、算法, 网页与 Python 的等价性, 以及论文数字与 data/derived/ 的一致性
      - name: pytest
        run: python -m pytest -q

      # 派生数据必须能由入库的 windows.csv 重新生成。
      # 这一步防止有人手改 JSON, 或改了代码却忘了重跑脚本。
      # (stylized_facts.py 需要非入库的 JST 原始数据, 故不在 CI 内运行。)
      # 第 8 节的两个脚本也在内: 它们的 JSON 直接支撑分城市建议与速查表,
      # 漏检就等于允许手改结论。(windows.csv 本身由 reproduce-windows.yml 验证。)
      - name: 派生数据可复现
        run: |
          for f in uncertainty cases china_2026 lookup_table; do
            cp data/derived/$f.json /tmp/$f.before.json
          done
          python analysis/uncertainty.py > /dev/null
          python analysis/cases.py > /dev/null
          python analysis/china_2026.py > /dev/null
          python analysis/lookup_table.py > /dev/null
          for f in uncertainty cases china_2026 lookup_table; do
            diff -u /tmp/$f.before.json data/derived/$f.json
          done

      - name: 网页计算器与数据同步
        run: |
          cp web/calculator.html /tmp/calculator.before.html
          cp web/index.html /tmp/index.before.html
          python analysis/build_web.py > /dev/null
          diff -q /tmp/calculator.before.html web/calculator.html
          diff -q /tmp/index.before.html web/index.html
